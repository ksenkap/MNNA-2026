model:
  vocab_size: 10000
  d_model: 512
  n_heads: 8
  n_kv_heads: 2         # GQA: 8 Q-голов / 2 K/V-группы = по 4 Q на группу
  n_layers: 8
  d_ff: 2048
  max_seq_len: 512
  dropout: 0.15

training:
  batch_size: 32
  learning_rate: 3e-4
  weight_decay: 0.05
  max_epochs: 10
  warmup_steps: 2000
  max_grad_norm: 1.0
  checkpoint_dir: /content/drive/MyDrive/CommonCrawl/checkpoints_lab4/
  log_dir: /content/drive/MyDrive/CommonCrawl/logs_lab4/
